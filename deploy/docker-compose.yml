# Déploiement du webservice WifiTest sur Fez (actif) + Avignon (secours).
# Conteneur ISOLÉ (ne touche pas GQQFM). Routé par Traefik via le réseau `web`.
# Tokens dans deploy/.env (jamais commité). Voir deploy/README.md.
services:
  wifitest:
    build: ../webservice
    image: wifitest-webservice:latest
    container_name: wifitest
    restart: unless-stopped
    env_file: .env
    environment:
      WIFITEST_DB: /data/jobs.db
      # Ces clés écrasent deploy/.env : les deux nœuds restent alignés (cf. TASKS §8).
      WIFITEST_DISPATCHER: "1"
      WIFITEST_POD_IMAGE: nvidia/cuda:12.4.1-runtime-ubuntu22.04
      WIFITEST_POD_GPU_COUNT: "1"
      WIFITEST_POD_COUNT: "4"
      WIFITEST_POD_GPUS: "NVIDIA GeForce RTX 4090;NVIDIA GeForce RTX 3090;NVIDIA GeForce RTX 4080 SUPER;NVIDIA GeForce RTX 4080;NVIDIA GeForce RTX 3090 Ti;NVIDIA GeForce RTX 4070 Ti SUPER;NVIDIA GeForce RTX 4070 Ti;NVIDIA GeForce RTX 5090"
      WIFITEST_MAX_POD_LIFE: "5400"
    volumes:
      - wifitest-data:/data
    networks:
      - web

volumes:
  wifitest-data:

networks:
  web:
    external: true
